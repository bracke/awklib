name = "awklib"
description = "AWK interpreter library in Ada, backed by the regexp engine"
version = "0.1.0"

authors = ["Bent Bracke"]
maintainers = ["Bent Bracke <bent@bracke.dk>"]
maintainers-logins = ["bracke"]
licenses = "MIT"
website = "https://github.com/bracke/awklib"
long-description = "awklib implements a POSIX-style AWK language as an embeddable Ada library. It parses and runs real, unmodified AWK programs over in-memory input and captures their standard output — its first consumer runs the IANA tzdb project's own ziguard/zishrink scripts, so behaviour aims to match one-true-awk / gawk for the language subset those programs use."
tags = ["awk", "interpreter", "text-processing"]
project-files = ["awklib.gpr"]

[[depends-on]]
gnat_native = "=15.2.1"

[[depends-on]]
regexp = "*"

[[pins]]
regexp = { path = "../regexp" }

[build-profiles]
"*" = "development"

[[actions]]
type = "test"
command = ["sh", "-c", "cd tests && alr build --development && ./bin/awklib_tests"]
